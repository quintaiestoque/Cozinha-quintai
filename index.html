<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Cozinha - Quintai Lounge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 15px;
        }
        h2 {
            text-align: center;
            color: #ffc107;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .nav-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-admin {
            background: #333;
            color: #ffc107;
            border: 1px solid #ffc107;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-chef {
            background: #333;
            color: #25d366;
            border: 1px solid #25d366;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-cadastrar {
            background: #1a1a1a;
            color: #25d366;
            border: 1px solid #25d366;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: none;
            width: 100%;
            margin-top: 5px;
            text-align: center;
        }
        .chef-info {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            color: #aaa;
            font-size: 14px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #2d2d2d;
            color: #fff;
            box-sizing: border-box;
        }
        .item-row {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #ffc107;
            transition: border-color 0.3s ease;
        }
        .item-row.alerta-critico {
            border-left: 4px solid #ff4d4d;
        }
        .item-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .inputs-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .input-block {
            flex: 1;
        }
        .input-block input {
            width: 100%;
            padding: 8px;
            text-align: center;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            font-size: 16px;
        }
        .input-block input:disabled {
            background: #1a1a1a;
            color: #777;
            border: 1px solid #2d2d2d;
            cursor: not-allowed;
        }
        .input-block input.input-alerta {
            background: #ff4d4d !important;
            color: #ffffff !important;
            font-weight: bold;
            animation: piscarAlerta 1.5s infinite;
        }
        @keyframes piscarAlerta {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        .counter-control {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-counter {
            background: #444;
            color: #888;
            border: none;
            width: 35px;
            height: 35px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: not-allowed;
        }
        .btn-counter.ativo {
            background: #ffc107;
            color: #000;
            cursor: pointer;
        }
        .btn-counter.ativo:active {
            background: #ffa000;
        }
        .btn-pdf {
            background: #25d366;
            color: #fff;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2);
        }
        .btn-pdf:active {
            background: #128c7e;
        }
        .category-title {
            color: #ffc107;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            margin: 25px 0 10px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .insumo-badge {
            background: #3a3a3a;
            color: #ffc107;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 10px;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-admin">
        <button class="btn-chef" id="btnModoChef" onclick="alternarModoChef()">🧑‍🍳 Entrar (Cozinha)</button>
        <button class="btn-admin" id="btnModoGerente" onclick="alternarModoGerente()">🔓 Estoque Inicial (Gerente)</button>
        <button class="btn-cadastrar" id="btnCadastrarItem" onclick="cadastrarNovoItem()">➕ Cadastrar Novo Item</button>
    </div>

    <h2>Controle de Cozinha 🧑‍🍳</h2>
    <div class="subtitle">Quintai Lounge</div>
    
    <div class="chef-info">
        <label>Responsável pela Cozinha no Turno:</label>
        <input type="text" id="nomeChef" placeholder="Ex: Chef Roberto Silva">
    </div>

    <div id="listaItens">
        <!-- Itens injetados via JavaScript por categoria -->
    </div>

    <div class="chef-info" style="margin-top: 15px;">
        <label>Observações / Ocorrências da Noite:</label>
        <textarea id="observacoes" rows="3" placeholder="Ex: Algum prato esgotou ou teve quebra de insumo?"></textarea>
    </div>

    <button class="btn-pdf" onclick="gerarPDFRelatorio()">Gerar Relatório Oficial 📄📱</button>
</div>

<script>
    const cardapioCategorizado = {
        "Entradas e Belisquetes": [
            { id: "espetinho_frango", nome: "Espetinho de Frango" },
            { id: "espetinho_frango_bacon", nome: "Espetinho de Frango c/ Bacon" },
            { id: "espetinho_carne_bacon", nome: "Espetinho de Carne c/ Bacon" },
            { id: "isca_file", nome: "Isca de Filé Acebolado", usaBatata: true },
            { id: "escondidinho_camarao", nome: "Escondidinho de Camarão" },
            { id: "escondidinho_carne", nome: "Escondidinho de Carne de Sol" },
            { id: "caldinho_camarao", nome: "Caldinho de Camarão" },
            { id: "caldinho_peixe", nome: "Caldinho de Peixe" },
            { id: "bolinho_bacalhau", nome: "Bolinho de Bacalhau Português" },
            { id: "batata_frita", nome: "Batata Frita (Simples)", eBatataBase: true },
            { id: "batata_bacon", nome: "Batata Frita com Bacon e Queijo", usaBatata: true }
        ],
        "Refeições Principais": [
            { id: "fetuccine_medalhao", nome: "Fetuccine Molho Queijo e Medalhão de Filé" },
            { id: "risoto_camarao", nome: "Risoto de Queijo com Camarões" },
            { id: "fetuccine_camarao", nome: "Fetuccine Trufado com Camarões" },
            { id: "spaguetti_quinta", nome: "Spaguetti à Quinta da Colina" },
            { id: "file_parmegiana", nome: "Filé à Parmegiana" }
        ],
        "Croissants Folhados": [
            { id: "croissant_base", nome: "Croissant Folhado (Massa Base)", eCroissantBase: true },
            { id: "croissant_frango", nome: "Croissant de Frango Catupiry", usaCroissant: true },
            { id: "croissant_carne", nome: "Croissant de Carne de Sol", usaCroissant: true },
            { id: "croissant_queijo_presunto", nome: "Croissant de Queijo e Presunto", usaCroissant: true },
            { id: "croissant_chocolate", nome: "Croissant de Chocolate Belga", usaCroissant: true },
            { id: "croissant_nutella", nome: "Croissant de Nutella c/ Morango", usaCroissant: true }
        ],
        "Itens Extras (Turno)": []
    };

    const SENHA_GERENTE = "2512";
    const SENHA_CHEF = "1010";
    const TELEFONE_GERENTE = "5583988212936";
    
    let gerenteLiberado = false;
    let chefLiberado = false;

    function criarElementoItem(item, isEditable, isChefEditable) {
        const div = document.createElement("div");
        div.className = "item-row";
        div.id = `row-${item.id}`;
        
        let badgeInsumo = "";
        if (item.usaBatata) {
            badgeInsumo = `<span class="insumo-badge">🍟 Usa Insumo Batata</span>`;
        } else if (item.eBatataBase) {
            badgeInsumo = `<span class="insumo-badge" style="color: #25d366;">📋 ESTOQUE BATATA</span>`;
        } else if (item.usaCroissant) {
            badgeInsumo = `<span class="insumo-badge">🥐 Usa Insumo Pão</span>`;
        } else if (item.eCroissantBase) {
            badgeInsumo = `<span class="insumo-badge" style="color: #25d366;">📋 ESTOQUE PÃO BASE</span>`;
        }

        let campoEstoqueInicial = `<input type="number" id="ini-${item.id}" value="0" min="0" ${isEditable ? '' : 'disabled'} onchange="calcularTodosOsSaldos()">`;
        if (item.usaBatata || item.usaCroissant) {
            campoEstoqueInicial = `<input type="text" value="Vinculado" disabled style="background: #1a1a1a; color: #777; font-size:12px;">`;
        }

        div.innerHTML = `
            <div class="item-name" id="name-${item.id}">${item.nome} ${badgeInsumo}</div>
            <div class="inputs-group">
                <div class="input-block">
                    <label>Inicial</label>
                    ${campoEstoqueInicial}
                </div>
                <div class="input-block">
                    <label>Saídas</label>
                    <div class="counter-control">
                        <button class="btn-counter ${isChefEditable ? 'ativo' : ''}" onclick="alterarSaida('${item.id}', -1)">-</button>
                        <input type="number" id="sai-${item.id}" value="0" min="0" disabled onchange="calcularTodosOsSaldos()">
                        <button class="btn-counter ${isChefEditable ? 'ativo' : ''}" onclick="alterarSaida('${item.id}', 1)">+</button>
                    </div>
                </div>
                <div class="input-block">
                    <label>Estoque</label>
                    <input type="number" id="saldo-${item.id}" value="0" disabled style="font-weight: bold;">
                </div>
            </div>
        `;
        return div;
    }

    function iniciarApp() {
        const container = document.getElementById("listaItens");
        container.innerHTML = "";

        for (const categoria in cardapioCategorizado) {
            if (cardapioCategorizado[categoria].length > 0 || categoria === "Itens Extras (Turno)") {
                const tituloCat = document.createElement("div");
                tituloCat.className = "category-title";
                tituloCat.id = `cat-title-${categoria.replace(/\s+/g, '')}`;
                tituloCat.innerText = categoria;
                container.appendChild(tituloCat);

                cardapioCategorizado[categoria].forEach(item => {
                    container.appendChild(criarElementoItem(item, gerenteLiberado, chefLiberado));
                });
            }
        }
        calcularTodosOsSaldos();
    }

    function cadastrarNovoItem() {
        if (!gerenteLiberado) return;
        
        const nomeNovoItem = prompt("Digite o nome do prato, refeição ou croissant especial:");
        if (nomeNovoItem && nomeNovoItem.trim() !== "") {
            const idUnico = "item_" + Date.now();
            const novoObjeto = { id: idUnico, nome: nomeNovoItem.trim() };
            
            cardapioCategorizado["Itens Extras (Turno)"].push(novoObjeto);
            
            const tituloExtras = document.getElementById("cat-title-ItensExtras(Turno)");
            const elementoNovo = criarElementoItem(novoObjeto, true, chefLiberado);
            
            tituloExtras.parentNode.insertBefore(elementoNovo, tituloExtras.nextSibling);
            alert(`"${nomeNovoItem}" foi adicionado aos Itens Extras do turno!`);
        }
    }

    function alternarModoGerente() {
        if (!gerenteLiberado) {
            const senhaDigitada = prompt("Digite a SENHA DO GERENTE:");
            if (senhaDigitada === SENHA_GERENTE) {
                gerenteLiberado = true;
                document.getElementById("btnModoGerente").innerText = "🔒 Bloquear Inicial";
                document.getElementById("btnModoGerente").style.background = "#ffc107";
                document.getElementById("btnModoGerente").style.color = "#000";
                document.getElementById("btnCadastrarItem").style.display = "block";
                atualizarEstadosCampos();
                alert("Estoque inicial liberado!");
            } else {
                alert("Senha incorreta!");
            }
        } else {
            gerenteLiberado = false;
            document.getElementById("btnModoGerente").innerText = "🔓 Estoque Inicial (Gerente)";
            document.getElementById("btnModoGerente").style.background = "#333";
            document.getElementById("btnModoGerente").style.color = "#ffc107";
            document.getElementById("btnCadastrarItem").style.display = "none";
            atualizarEstadosCampos();
        }
    }

    function alternarModoChef() {
        if (!chefLiberado) {
            const senhaDigitada = prompt("Digite a SENHA DA COZINHA:");
            if (senhaDigitada === SENHA_CHEF) {
                chefLiberado = true;
                document.getElementById("btnModoChef").innerText = "🔒 Sair (Bloquear Cozinha)";
                document.getElementById("btnModoChef").style.background = "#25d366";
                document.getElementById("btnModoChef").style.color = "#fff";
                atualizarEstadosCampos();
                alert("Painel da cozinha liberado!");
            } else {
                alert("Senha incorreta!");
            }
        } else {
            chefLiberado = false;
            document.getElementById("btnModoChef").innerText = "🧑‍🍳 Entrar (Cozinha)";
            document.getElementById("btnModoChef").style.background = "#333";
            document.getElementById("btnModoChef").style.color = "#25d366";
            atualizarEstadosCampos();
        }
    }

    function atualizarEstadosCampos() {
        for (const cat in cardapioCategorizado) {
            cardapioCategorizado[cat].forEach(item => {
                const inputIni = document.getElementById(`ini-${item.id}`);
                if (inputIni && !item.usaBatata && !item.usaCroissant) inputIni.disabled = !gerenteLiberado;

                const row = document.getElementById(`row-${item.id}`);
                if (row) {
                    const botoes = row.getElementsByClassName("btn-counter");
                    for (let btn of botoes) {
                        if (chefLiberado) {
                            btn.classList.add("ativo");
                        } else {
                            btn.classList.remove("ativo");
                        }
                    }
                }
            });
        }
    }

    function alterarSaida(id, valor) {
        if (!chefLiberado) {
            alert("A cozinha está bloqueada. Clique em 'Entrar (Cozinha)' para liberar.");
            return;
        }
        const inputSaida = document.getElementById(`sai-${id}`);
        let atual = parseInt(inputSaida.value) || 0;
        atual += valor;
        if (atual < 0) atual = 0;
        inputSaida.value = atual;
        calcularTodosOsSaldos();
    }

    function calcularTodosOsSaldos() {
        let totalSaidasBatata = 0;
        let totalSaidasCroissant = 0;

        // Calcula totalizações de saídas dos insumos controlados
        for (const cat in cardapioCategorizado) {
            cardapioCategorizado[cat].forEach(item => {
                const inputSai = document.getElementById(`sai-${item.id}`);
                const qtdSaidas = inputSai ? parseInt(inputSai.value) || 0 : 0;
                
                if (item.eBatataBase || item.usaBatata) {
                    totalSaidasBatata += qtdSaidas;
                }
                if (item.eCroissantBase || item.usaCroissant) {
                    totalSaidasCroissant += qtdSaidas;
                }
            });
        }

        // Recupera estoques bases
        const inputIniBatata = document.getElementById("ini-batata_frita");
        const inicialBatata = inputIniBatata ? parseInt(inputIniBatata.value) || 0 : 0;
        let saldoRealBatata = inicialBatata - totalSaidasBatata;
        if (saldoRealBatata < 0) saldoRealBatata = 0;

        const inputIniCroissant = document.getElementById("ini-croissant_base");
        const inicialCroissant = inputIniCroissant ? parseInt(inputIniCroissant.value) || 0 : 0;
        let saldoRealCroissant = inicialCroissant - totalSaidasCroissant;
        if (saldoRealCroissant < 0) saldoRealCroissant = 0;

        // Distribui e atualiza as cores na tela
        for (const cat in cardapioCategorizado) {
            cardapioCategorizado[cat].forEach(item => {
                const inputSaldo = document.getElementById(`saldo-${item.id}`);
                const rowItem = document.getElementById(`row-${item.id}`);
                let saldoFinal = 0;

                if (item.eBatataBase || item.usaBatata) {
                    saldoFinal = saldoRealBatata;
                } else if (item.eCroissantBase || item.usaCroissant) {
                    saldoFinal = saldoRealCroissant;
                } else {
                    const inputIni = document.getElementById(`ini-${item.id}`);
                    const inputSai = document.getElementById(`sai-${item.id}`);
                    const inicial = inputIni ? parseInt(inputIni.value) || 0 : 0;
                    const saidas = inputSai ? parseInt(inputSai.value) || 0 : 0;
                    saldoFinal = inicial - saidas;
                    if (saldoFinal < 0) saldoFinal = 0;
                }

                if (inputSaldo) {
                    inputSaldo.value = saldoFinal;
                    if (saldoFinal < 5) {
                        inputSaldo.classList.add("input-alerta");
                        if (rowItem) rowItem.classList.add("alerta-critico");
                    } else {
                        inputSaldo.classList.remove("input-alerta");
                        if (rowItem) rowItem.classList.remove("alerta-critico");
                        inputSaldo.style.color = "#ffc107";
                        inputSaldo.style.background = "#1a1a1a";
                    }
                }
            });
        }
    }

    function gerarPDFRelatorio() {
        const chef = document.getElementById("nomeChef").value || "Não informado";
        const obs = document.getElementById("observacoes").value || "Sem ocorrências registradas.";
        const dataAtual = new Date().toLocaleDateString('pt-BR');

        let htmlImpressao = `
        <!DOCTYPE html>
        <html>
        <head>
            <title>Relatório de Cozinha - ${dataAtual}</title>
            <style>
                body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #000; background: #fff; padding: 30px; line-height: 1.4; }
                .header-main { text-align: center; border-bottom: 3px double #000; padding-bottom: 12px; margin-bottom: 20px; }
                h1 { margin: 0; font-size: 24pt; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
                .lounge { margin: 5px 0 0 0; color: #333; font-weight: bold; text-transform: uppercase; font-size: 13pt; letter-spacing: 0.5px; }
                
                .info-grid { display: flex; flex-wrap: wrap; justify-content: space-between; background: #f9f9f9; padding: 15px; margin-bottom: 30px; border: 1px solid #e1e1e1; border-radius: 6px; font-size: 11pt; }
                .info-block { width: 48%; margin-bottom: 8px; }
                
                .section-title { margin-top: 30px; background: #f2f2f2; padding: 6px 10px; text-transform: uppercase; font-size: 12pt; font-weight: bold; border-left: 5px solid #000; letter-spacing: 0.5px; }
                table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 20px; }
                th { background: #1a1a1a; color: #fff; text-transform: uppercase; font-size: 9pt; padding: 10px 8px; font-weight: bold; border: 1px solid #1a1a1a; }
                td { padding: 10px 8px; border-bottom: 1px solid #e0e0e0; border-left: 1px solid #e0e0e0; border-right: 1px solid #e0e0e0; font-size: 10pt; }
                
                .status-disp { color: #0e6251; font-weight: bold; font-size: 9pt; text-transform: uppercase; }
                .status-critico { color: #7b241c; font-weight: bold; font-size: 9pt; text-transform: uppercase; background-color: #fadbd8 !important; }
                .status-zerado { color: #7f8c8d; font-weight: bold; font-size: 9pt; text-transform: uppercase; background-color: #eaeded !important; }
                
                .cell-center { text-align: center; }
                .cell-bold { font-weight: bold; }
                
                .obs-title { font-weight: bold; text-transform: uppercase; margin-top: 35px; font-size: 11pt; border-left: 5px solid #000; padding-left: 8px; }
                .obs-box { background: #fff; padding: 15px; border: 1px solid #d9d9d9; border-radius: 5px; font-size: 10.5pt; min-height: 70px; margin-top: 8px; line-height: 1.5; text-align: justify; }
                
                .assinaturas { margin-top: 70px; display: flex; justify-content: space-between; font-size: 10pt; text-align: center; }
                .linha-ass { width: 42%; border-top: 1px solid #000; padding-top: 6px; font-weight: bold; }
                .sub-ass { color: #555; font-size: 8.5pt; text-transform: uppercase; font-weight: normal; margin-top: 2px; display: block; }
                .footer-page { text-align: center; margin-top: 60px; font-size: 8.5pt; color: #7f8c8d; border-top: 1px dashed #e0e0e0; padding-top: 10px; text-transform: uppercase; }
            </style>
        </head>
        <body>
            <div class="header-main">
                <h1>Controle de Cozinha</h1>
                <div class="lounge">Quintai Lounge</div>
            </div>
            
            <div class="info-grid">
                <div class="info-block"><strong>DATA DO TURNO:</strong> ${dataAtual}</div>
                <div class="info-block" style="text-align: right;"><strong>STATUS DO FECHAMENTO:</strong> Concluído</div>
                <div class="info-block"><strong>RESPONSÁVEL DA COZINHA:</strong> ${chef}</div>
            </div>
            
            <div class="section-title">Movimentação de Estoque e Porções</div>
            <table>
                <thead>
                    <tr>
                        <th style="text-align: left; width: 40%;">Item / Petisco</th>
                        <th style="text-align: center; width: 15%;">Estoque Inicial</th>
                        <th style="text-align: center; width: 15%;">Quantidade Saídas</th>
                        <th style="text-align: center; width: 15%;">Saldo Final</th>
                        <th style="text-align: center; width: 15%;">Status do Item</th>
                    </tr>
                </thead>
                <tbody>
        `;

        for (const categoria in cardapioCategorizado) {
            if (cardapioCategorizado[categoria].length > 0) {
                cardapioCategorizado[categoria].forEach(item => {
                    const inputIni = document.getElementById(`ini-${item.id}`);
                    const inputSai = document.getElementById(`sai-${item.id}`);
                    const inputSaldo = document.getElementById(`saldo-${item.id}`);
                    
                    let inicialTxt = inputIni ? inputIni.value : "0";
                    if (item.usaBatata || item.usaCroissant) inicialTxt = "Vinculado";
                    
                    const saidas = inputSai ? parseInt(inputSai.value) || 0 : 0;
                    const saldo = inputSaldo ? parseInt(inputSaldo.value) || 0 : 0;
                    
                    let statusTxt = "DISPONÍVEL";
                    let classeStatus = 'class="cell-center status-disp"';
                    
                    if (saldo === 0) {
                        statusTxt = "ZERADO";
                        classeStatus = 'class="cell-center status-zerado"';
                    } else if (saldo < 5) {
                        statusTxt = "ALERTA CRÍTICO";
                        classeStatus = 'class="cell-center status-critico"';
                    }

                    htmlImpressao += `
                        <tr>
                            <td><strong>${item.nome}</strong></td>
                            <td class="cell-center">${inicialTxt}</td>
                            <td class="cell-center">${saidas}</td>
                            <td class="cell-center cell-bold">${saldo}</td>
                            <td ${classeStatus}>${statusTxt}</td>
                        </tr>
                    `;
                });
            }
        }

        htmlImpressao += `
                </tbody>
            </table>
            
            <div class="obs-title">Observações e Ocorrências do Turno</div>
            <div class="obs-box">${obs.replace(/\n/g, '<br>')}</div>
            
            <div class="assinaturas">
                <div class="linha-ass">${chef}<span class="sub-ass">Responsável pela Cozinha</span></div>
                <div class="linha-ass">Lucas Emanuel P. S. Gomes<span class="sub-ass">Maître</span></div>
            </div>
            
            <div class="footer-page">Quintai Lounge &nbsp;|&nbsp; Página 1 de 1</div>

            <script>
                window.onload = function() {
                    window.print();
                    setTimeout(function() { window.close(); }, 500);
                };
            <\/script>
        </body>
        </html>
        `;

        let janelaImpressao = window.open('', '_blank');
        janelaImpressao.document.write(htmlImpressao);
        janelaImpressao.document.close();

        setTimeout(() => {
            const textoZap = `📋 *FECHAMENTO DE COZINHA - QUINTAI LOUNGE*\n📅 Data: ${dataAtual}\n🧑‍🍳 Responsável: *${chef}*\n\n❗ _O relatório oficial de fechamento de estoque foi gerado. Por favor, salve o PDF da tela de impressão e anexe o arquivo nesta conversa._`;
            const linkZap = `https://api.whatsapp.com/send?phone=${TELEFONE_GERENTE}&text=${encodeURIComponent(textoZap)}`;
            window.open(linkZap, '_blank');
        }, 1800);
    }

    window.onload = iniciarApp;
</script>
</body>
</html>
